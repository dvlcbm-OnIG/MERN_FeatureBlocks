<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
<link rel="stylesheet" href="./EmployeeLIst.css">
</head>
<body>
    <div class="container">
        <div class="search-wrap">
            <label for="search" class="search-label">Search</label>
            <input type="text" id="search" placeholder="Search employees...">
        </div>

        <div id="deleteModal" class="delete-modal hidden" aria-hidden="true">
            <div class="delete-modal-message">Delete this employee?</div>
            <div class="delete-modal-actions">
                <button id="cancelDeleteBtn" class="modal-btn modal-btn-cancel">No</button>
                <button id="confirmDeleteBtn" class="modal-btn modal-btn-confirm">Yes</button>
            </div>
        </div>

        <div class="nav-header">
            <a href="/" class="back-home-link">← Back to Home</a>
            <h1>Employee List</h1>
            <div></div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Created At</th>
                        <th>Updated At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Allow to use AXIOS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./EmployeeList.js"></script>
</body>
</html>
