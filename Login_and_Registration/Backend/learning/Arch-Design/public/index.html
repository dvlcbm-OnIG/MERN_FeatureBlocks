<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #2c3e50;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        input::placeholder {
            color: #bdc3c7;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .link-section {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
        }

        .view-employees-link {
            display: inline-block;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .view-employees-link:hover {
            color: #2980b9;
            background: #ecf0f1;
        }

        .form-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-message.error {
            background: #fadbd8;
            color: #c0392b;
            border: 1px solid #e74c3c;
        }

        .form-message.success {
            background: #d5f4e6;
            color: #27ae60;
            border: 1px solid #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Employee</h1>
        <div id="formMessage" class="form-message"></div>
        <form id="employeeForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Enter age" min="18" max="100" required>
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" name="salary" placeholder="Enter salary" min="0" required>
                </div>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select a department</option>
                    <option value="HR">HR</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Sales">Sales</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>

            <button type="submit">Create Employee</button>
            
            <div class="link-section">
                <a href="/EmployeeList" class="view-employees-link">View All Employees →</a>
            </div>
        </form>
    </div>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Get the form element and message container
        const employeeForm = document.getElementById('employeeForm');
        const formMessage = document.getElementById('formMessage');

        // Handle form submission
        employeeForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Collect form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                age: parseInt(document.getElementById('age').value),
                department: document.getElementById('department').value,
                salary: parseInt(document.getElementById('salary').value)
            };

            try {
                // Send POST request to /SWE endpoint
                const response = await axios.post('/SWE', formData);
                const responseData = Array.isArray(response.data) ? response.data[0] : response.data;
                
                console.log('Employee created successfully:', response.data);
                
                // Show success message
                formMessage.classList.toggle('success', responseData?.success ?? true);
                formMessage.classList.remove('error');
                formMessage.textContent = responseData?.message || 'Employee created successfully';
                formMessage.style.display = 'block';
                
                // Reset form
                employeeForm.reset();
                
                // Hide message after 3 seconds
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 3000);
                
            } catch (error) {
                console.error('Error creating employee:', error.response?.data || error.message);
                
                // Show error message
                formMessage.classList.toggle('error', true);
                formMessage.classList.remove('success');
                formMessage.textContent = error.response?.data?.message || 'Failed to create employee';
                formMessage.style.display = 'block';

                // Hide message after 3 seconds
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
