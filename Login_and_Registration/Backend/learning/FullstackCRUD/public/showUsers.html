<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Users</title>
    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: #1c1e21;
            background: #f0f2f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
        }

        .list-card {
            width: min(100%, 430px);
            padding: 28px;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px rgb(0 0 0 / 12%);
        }

        h1 {
            margin: 0 0 8px;
            color: #1877f2;
            font-size: 28px;
            text-align: center;
        }

        .intro {
            margin: 0 0 20px;
            color: #606770;
            text-align: center;
        }

        #userList {
            margin: 0;
            padding-left: 24px;
            line-height: 1.8;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <main class="list-card">
        <h1>Users</h1>
        <p class="intro">Ordered list of user names.</p>

        <ol id="userList"></ol>
        <p id="errorFeed" style="color: red; text-align: center;"></p>
        <a href="/">Login</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Add your fetch logic here and append only user names as <li> items.
        // Example target: <ol id="userList"></ol>
        async function getData() {
            const userList = document.getElementById('userList')
            const errorFeed = document.getElementById('errorFeed')

            try {
                const response = await axios.get('/collection1')

                //to reset the least after the deletion, to avoid double lists
                userList.innerHTML = '';
                response.data.forEach(user => {

                    userList.innerHTML += `
                    <li>${user.name} - ${user.age}

                        <button onclick="deleteUser('${user._id}')"> Remove </button>
                    </li>
                    `
                    
                });
            } catch {
                errorFeed.innerHTML = "Unable to connect to the server"
            }

        }

        // Delete user  (AI generated code. Recreate later)
        async function deleteUser(id) {

            const errorFeed = document.getElementById('errorFeed');

            try {

                await axios.delete(`/collection1/${id}`);

                // Refresh the user list
                getData();

            } catch {
                //this will trigger when there is a delete api issue after the button is clicked. E.g., incorrect endpoint int the delete method on the server.
                errorFeed.textContent =
                    "Unable to delete user";

            }
        }

        getData()

    </script>
</body>

</html>
