<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="showUsers.css">
</head>

<body>
    <main class="list-card">
        <header>
            <h1>Users</h1>
            <p class="intro">Ordered list of user names.</p>
            
        </header>

        <div class="list-content">
            <ol id="userList"></ol>
        </div>
        <div class="card-footer">
            <p id="errorFeed"></p>
            <a class="login-link" href="/">Login</a>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Add your fetch logic here and append only user names as <li> items.
        // Example target: <ol id="userList"></ol>
        async function getData() {
            const userList = document.getElementById('userList')
            const errorFeed = document.getElementById('errorFeed')

            try {
                const response = await axios.get('/collection1')

                //to reset the least after the deletion, to avoid double lists
                userList.innerHTML = '';
                response.data.forEach(user => {

                    userList.innerHTML += `
                    <li>
                        <div class="users">${user.name} - ${user.age}</div>
                        <button onclick="deleteUser('${user._id}')"> Remove </button>
                    </li>
                    `
                    
                });
            } catch {
                errorFeed.innerHTML = "Unable to connect to the server"
            }

        }

        // Delete user  (AI generated code. Recreate later)
        async function deleteUser(id) {

            const errorFeed = document.getElementById('errorFeed');

            try {

                await axios.delete(`/collection1/${id}`);

                // Refresh the user list
                getData();

            } catch {
                //this will trigger when there is a delete api issue after the button is clicked. E.g., incorrect endpoint int the delete method on the server.
                errorFeed.textContent =
                    "Unable to delete user";

            }
        }

        getData()

    </script>
</body>

</html>
